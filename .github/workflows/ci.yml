name: CI

# PR 轻量检查：不构建 Docker 镜像，做 Python 编译/导入/单测和前端 lint/构建。

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python compile, import & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            web_app/requirements.txt

      - name: Compile check
        run: python -m compileall -q seseget web_app scripts

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r web_app/requirements.txt -r requirements-dev.txt

      - name: Import check
        run: |
          python -c "import seseget; from seseget.request.fetcher import FetcherRegistry; print('sites:', FetcherRegistry.list_sites())"
          python -c "import web_app; print('web_app import OK')"

      - name: Run Ruff
        run: python -m ruff check seseget web_app tests scripts

      - name: Run mypy
        run: python -m mypy

      - name: Run Python tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json

      - name: Install dependencies
        working-directory: web_frontend
        run: npm ci

      - name: Lint frontend
        working-directory: web_frontend
        run: npm run lint

      - name: Build frontend
        working-directory: web_frontend
        run: npm run build --ignore-scripts
